name: DeepSeek Harness
version: "0.1.0"
slug: dsh_ha_ingress_auth
url: https://github.com/edgarfroes/dsh-ha-ingress-auth
# Prebuilt multi-arch image published by .github/workflows/release.yaml.
# Delete this line to build the app on the device instead.
image: ghcr.io/edgarfroes/dsh-ha-ingress-auth
description: DeepSeek Harness with Home Assistant users, admin-only settings and private chats
arch:
  - amd64
  - aarch64
ingress: true
ingress_stream: true
panel_title: DeepSeek Harness
panel_icon: mdi:robot-outline
# Every HA user (not only admins) gets the sidebar entry; the app itself
# decides what each role may do.
panel_admin: false
# Needed to read HA users and their groups (Core WebSocket config/auth/list).
homeassistant_api: true
options:
  idle_timeout_minutes: 30
  # Remote MCP servers every user's dsh connects to: one name/URL pair per
  # server (Streamable HTTP). Tools appear as mcp__name__tool. An empty list
  # disables. Edit in the app's Settings page on Home Assistant.
  mcp_servers: []
schema:
  idle_timeout_minutes: int(0,1440)
  mcp_servers:
    - name: str
      url: url
