name: DeepSeek Harness
version: "0.1.0"
slug: dsh_ha_ingress_auth
description: DeepSeek Harness with Home Assistant users, admin-only settings and private chats
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: DeepSeek Harness
panel_icon: mdi:robot-outline
# Every HA user (not only admins) gets the sidebar entry; the app itself
# decides what each role may do.
panel_admin: false
# Needed to read HA users and their groups (Core WebSocket config/auth/list).
homeassistant_api: true
backup: hot
options:
  idle_timeout_minutes: 30
schema:
  idle_timeout_minutes: int(0,1440)
