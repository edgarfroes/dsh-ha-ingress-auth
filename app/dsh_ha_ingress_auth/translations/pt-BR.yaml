configuration:
  idle_timeout_minutes:
    name: Inatividade de não-admins (minutos)
    description: >-
      Encerra o processo do DeepSeek Harness de um usuário não-admin após este
      número de minutos sem navegador aberto e sem resposta em andamento. 0
      mantém em execução. Processos de admins nunca são encerrados, então o
      trabalho agendado deles continua rodando.
  mcp_servers:
    name: Servidores MCP remotos
    description: >-
      Servidores Model Context Protocol aos quais o DeepSeek Harness de cada
      usuário se conecta pela rede (Streamable HTTP), por nome e URL. As
      ferramentas aparecem nativamente em todos os chats como
      mcp__nome__ferramenta; um servidor inacessível gera apenas um aviso.
      Deixe vazio para nenhum.
    fields:
      name:
        name: Nome do servidor
        description: >-
          Identificador curto usado nos nomes das ferramentas: letras,
          números, hífens ou sublinhados, até 32 caracteres (por exemplo
          "firecrawl").
      url:
        name: URL do servidor
        description: Endpoint MCP do servidor, por exemplo http://meu-servidor:3000/mcp.
  plugins:
    name: Plugins extras do dsh
    description: >-
      ⚠️ Cuidado: um plugin roda dentro do DeepSeek Harness com acesso total
      aos dados deste app, aos chats de todos os usuários e às credenciais
      salvas. Adicione só pacotes em que você confia e que revisou, e fixe
      uma versão exata. Uma especificação de pacote npm por linha, por
      exemplo "dsh-plugin-foo@1.2.3", um endereço git ou a URL de um
      tarball; precisa ser um bundle de plugin do dsh. Os plugins são
      instalados quando o app inicia (precisa de internet nesse momento) e
      carregam para todos os usuários; remover uma linha desinstala no
      próximo reinício. Scripts de instalação das dependências não rodam, e
      não-admins continuam com só as ferramentas que este app permite.
      Encontre plugins na
      [lista dsh-plugin do npm](https://www.npmjs.com/search?q=keywords:dsh-plugin)
      (não é uma lista verificada).
